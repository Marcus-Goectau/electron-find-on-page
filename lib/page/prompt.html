<html>
    <head>
        <link href="prompt.css" rel="stylesheet" />
    </head>
    <body>
        <div id="container">
            <form id="form">
                <div id="input-wrapper">
                    <div id="data-container"></div>
                    <div id="match-counter"></div>
                </div>
                <div id="buttons">
                    <div id="toggle-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="match-case" />
                            <span class="toggle-slider"></span>
                            <span class="toggle-label" id="match-case-label">Match case</span>
                        </label>
                    </div>
                    <div id="nav-buttons">
                        <button type="button" id="find-previous" title="Previous match">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                                <polyline points="12,10 8,6 4,10"/>
                            </svg>
                        </button>
                        <button type="button" id="find-next" title="Next match">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                                <polyline points="4,6 8,10 12,6"/>
                            </svg>
                        </button>
                        <button type="button" id="cancel" title="Close">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                                <line x1="4" y1="4" x2="12" y2="12"/>
                                <line x1="12" y1="4" x2="4" y2="12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <script src="prompt.js"></script>
    </body>
</html>
